<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Presupuesto</title>
    <link rel="stylesheet" href="avance1/css/estilos.css" />
    <script src="avance1/js/Dato.js"></script>
    <script src="avance1/js/Ingreso.js"></script>
    <script src="avance1/js/Egreso.js"></script>
    <script src="avance1/js/app.js"></script>
  </head>
  <body onload="cargarApp()">
    <!-- Cabecero -->
    <div class="cabecero">
      <div class="presupuesto">
        <div class="presupuesto_titulo">Presupuesto Disponible</div>
        <div class="presupuesto_valor" id="presupuesto">+2,000.00</div>

        <div class="presupuesto_ingreso limpiarEstilos">
          <div class="presupuesto_ingreso--texto">Ingresos</div>
          <div class="derecha">
            <div class="presupuesto_ingreso--valor" id="ingresos">
              +4,000.00
            </div>
            <div class="presupuesto_ingreso--porcentaje">&nbsp;</div>
          </div>
        </div>

        <div class="presupuesto_egreso limpiarEstilos">
          <div class="presupuesto_egreso--texto">Egresos</div>
          <div class="derecha limpiarEstilos">
            <div class="presupuesto_egreso--valor" id="egresos">-1,900.00</div>
            <div class="presupuesto_egreso--porcentaje" id="porcentaje">
              45 %
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Formulario -->
    <form id="forma" onsubmit="return false;">
      <div class="agregar">
        <div class="agregar_contenedor">
          <select class="agregar_tipo" id="tipo">
            <option value="ingreso" selected>+</option>
            <option value="egreso">-</option>
          </select>

          <input
            type="text"
            class="agregar_descripcion"
            id="descripcion"
            placeholder="Agregar Descripción"
          />

          <input
            type="number"
            class="agregar_valor"
            id="valor"
            placeholder="Valor"
            name="valor"
            step="any"
          />

          <button class="agregar_btn" onclick="agregarDato()">
            <ion-icon name="checkmark-circle-outline"></ion-icon>
          </button>
        </div>
      </div>
    </form>

    <!-- Contenedor -->
    <div class="contenedor limpiarEstilos">
      <!-- Ingresos -->
      <div class="ingreso">
        <h2 class="ingreso_titulo">Ingresos</h2>

        <div id="lista-ingresos">
          <div class="elemento limpiarEstilos">
            <div class="elemento_descripcion">Salario</div>
            <div class="derecha limpiarEstilos">
              <div class="elemento_valor">+2,200.00</div>
              <div class="elemento_eliminar">
                <button class="elemento_eliminar--btn">
                  <ion-icon name="close-circle-outline"></ion-icon>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Egresos -->
      <div class="egreso">
        <h2 class="egreso_titulo">Egresos</h2>

        <div id="lista-egresos">
          <div class="elemento limpiarEstilos">
            <div class="elemento_descripcion">Renta departamento</div>
            <div class="derecha limpiarEstilos">
              <div class="elemento_valor">-900.00</div>
              <div class="elemento_porcentaje">21 %</div>
              <div class="elemento_eliminar">
                <button class="elemento_eliminar--btn">
                  <ion-icon name="close-circle-outline"></ion-icon>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Ionicons -->
    <script
      type="module"
      src="https://unpkg.com/ionicons@5.4.0/dist/ionicons/ionicons.esm.js"
    ></script>
  </body>
  <footer class="footer">
    <p>&copy; 2026 R. Antonio Lopez Garcia. Todos los derechos reservados.</p>
    <nav>
      <a href="#">Inicio</a>
      <a href="https://despachocontablemexico.com/">Servicios</a>
      <a href="https://wa.me/526441543521">Contacto</a>
    </nav>
  </footer>
</html>
